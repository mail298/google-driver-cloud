services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://drive9-backend.wn-cdn.net}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_CDN_SUBDOMAINS: ${VITE_CDN_SUBDOMAINS:-}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    labels:
      - "gatus.enable=true"
      - "gatus.name=node-js : google-driver-cloud - Frontend"
      - "gatus.group=Applications"
      - "gatus.url=https://drive9.wn-cdn.net"
      - "gatus.interval=60s"
      - "gatus.conditions=[STATUS] == any(200, 301, 302, 307, 401, 403), [RESPONSE_TIME] < 5000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-9drive}?connection_limit=10&connect_timeout=30}
      APP_PORT: ${APP_PORT:-80}
      FRONTEND_URL: ${FRONTEND_URL:-https://drive9.wn-cdn.net}
      # SECURITY: Override these defaults in your .env file before going to production!
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-$$2a$$10$$3OOX0YLB52DERef3Q/jn9ei0zTME0ieZrcYQ4mflZ.BPgTMszTgsq}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-uf2Tqd29Y6l2RFhM9xLQ0bvmfRjyroxjQI2HRsQH3rdjdE1SgvVvMjkwZJxlXrMb}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      MAX_UPLOAD_BYTES: 5368709120
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://drive9-backend.wn-cdn.net/connected-accounts/google/callback}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CDN_SUBDOMAINS: ${CDN_SUBDOMAINS:-}
    volumes:
      - backend_logs:/app/logs
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "gatus.enable=true"
      - "gatus.name=node-js : google-driver-cloud - Backend"
      - "gatus.group=Applications"
      - "gatus.url=https://drive9-backend.wn-cdn.net/health"
      - "gatus.interval=60s"
      - "gatus.conditions=[STATUS] == any(200, 301, 302, 307, 401, 403), [RESPONSE_TIME] < 5000"

  mysql:
    image: mysql:8.4
    command: --performance_schema=OFF --max_connections=100 --innodb_buffer_pool_size=64M
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  backend_logs: