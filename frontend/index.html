  <script>
    (function () {
      const saved = localStorage.getItem('9drive:theme');
      const theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
